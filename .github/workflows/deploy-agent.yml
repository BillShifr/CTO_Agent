name: Deploy production agent

on:
  workflow_run:
    workflows: [Agent checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Agent checks run ID for a push to main
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production-one-c-agent
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [avtopult-one-c-production]
    environment: production
    timeout-minutes: 20
    steps:
      - name: Resolve and verify the successful main CI run
        id: release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REQUESTED_RUN_ID -notmatch '^\d+$') { throw 'run_id must be numeric.' }
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $run = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/$env:REQUESTED_RUN_ID"
          $main = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/branches/main"
          if ($run.name -ne 'Agent checks' -or $run.path -ne '.github/workflows/ci.yml') {
            throw 'The selected run was not produced by the reviewed Agent checks workflow.'
          }
          if ($run.conclusion -ne 'success' -or $run.event -ne 'push' -or $run.head_branch -ne 'main') {
            throw 'The selected run must be a successful push build of main.'
          }
          if ($run.head_repository.full_name -ne '${{ github.repository }}' -or $run.head_sha -notmatch '^[a-f0-9]{40}$') {
            throw 'The selected run does not belong to this repository or has an invalid revision.'
          }
          if ($run.head_sha -ne $main.commit.sha) {
            throw 'The selected run is not the current main revision. Wait for the latest main CI run.'
          }
          "run_id=$($run.id)" >> $env:GITHUB_OUTPUT
          "head_sha=$($run.head_sha)" >> $env:GITHUB_OUTPUT

      - name: Download the exact Windows artifact from that run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: one-c-agent-windows-latest
          path: ${{ runner.temp }}\avtopult-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.release.outputs.run_id }}

      - name: Verify, update, check heartbeat and roll back on failure
        shell: powershell
        env:
          EXPECTED_SOURCE_REVISION: ${{ steps.release.outputs.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'avtopult-release'
          $archives = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter 'AvtoPult-OneCAgent-windows-x64.zip')
          if ($archives.Count -ne 1) { throw "Expected one agent archive, found $($archives.Count)." }
          $checksumPath = "$($archives[0].FullName).sha256"
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) { throw 'Agent archive checksum file is missing.' }
          $checksumLine = (Get-Content -LiteralPath $checksumPath -Raw -Encoding UTF8).Trim()
          if ($checksumLine -notmatch '^([a-f0-9]{64})  AvtoPult-OneCAgent-windows-x64\.zip$') {
            throw 'Agent archive checksum file is malformed.'
          }
          $actual = (Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $Matches[1]) { throw 'Agent archive checksum mismatch.' }
          $deployment = 'C:\ProgramData\AvtoPult\Deployment'
          . (Join-Path $deployment 'production-deployment.ps1')
          $toolStage = Join-Path $env:RUNNER_TEMP 'avtopult-verified-tools'
          $verified = Expand-VerifiedAgentArchive -Archive $archives[0].FullName `
            -ExpectedSha256 $Matches[1] -Destination $toolStage
          & (Join-Path $toolStage 'deploy-agent-release.ps1') `
            -Archive $archives[0].FullName `
            -ExpectedSha256 $verified.archiveSha256 `
            -DeploymentDirectory $deployment
          if (-not $?) { throw 'Production deployment command failed.' }
          $release = Get-Content -LiteralPath 'C:\one-c-agent\RELEASE.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($release.sourceRevision -ne $env:EXPECTED_SOURCE_REVISION) {
            throw "Installed revision $($release.sourceRevision) differs from CI revision $env:EXPECTED_SOURCE_REVISION."
          }
          "Agent revision: $($release.sourceRevision)" >> $env:GITHUB_STEP_SUMMARY
          "Deployment report directory: C:\ProgramData\AvtoPult\Deployment\reports" >> $env:GITHUB_STEP_SUMMARY

      - name: Remove downloaded release from the persistent runner
        if: always()
        shell: powershell
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'avtopult-release'
          if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
          $tools = Join-Path $env:RUNNER_TEMP 'avtopult-verified-tools'
          if (Test-Path -LiteralPath $tools) { Remove-Item -LiteralPath $tools -Recurse -Force }
