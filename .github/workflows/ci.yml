name: Agent checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm run check
      - name: Parse Windows service scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Exercise Windows update and rollback transactions
        if: runner.os == 'Windows'
        shell: powershell
        run: ./test-windows-maintenance.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: one-c-agent-${{ matrix.os }}
          path: .artifacts/one-c-agent/
